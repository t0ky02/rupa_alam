<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2F4A3C">
  <title>Shop — Rupa Alam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/apple-touch.png">
  <link rel="icon" href="assets/img/icon-rupaalam.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <section class="section">
      <div class="wrap">
        <div class="tag" data-i18n="shop.tag">The house oils</div>
        <h2 data-i18n="shop.title">Shop</h2>
        <p class="lede" data-i18n="shop.lede">Rupa Alam's product is still on processing of the making to give you the natural sensation that you are looking for.</p>
        <div class="grid-3" id="shop"></div>
      </div>
    </section>
    <footer class="footer" data-i18n="footer.shop">Small batch · botanical · made for humid evenings</footer>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <script src="assets/js/app.js"></script>
  <script>
    window.__onLangChange = function () {
      mountShop(document.getElementById("shop"));
    };
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        if (document.getElementById("shop") && !document.getElementById("shop").innerHTML) {
          mountShop(document.getElementById("shop"));
        }
      }, 100);
    });
  </script>
</body>
</html>
