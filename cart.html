<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2F4A3C">
  <title>Cart — Rupa Alam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/apple-touch.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cart">
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <section class="section">
      <div class="wrap" style="max-width:720px">
        <div class="tag" data-i18n="cart.tag">Your ritual</div>
        <h2 data-i18n="cart.title">Cart</h2>
        <div id="list"></div>
        <div class="totals" id="box" hidden>
          <div><span data-i18n="cart.subtotal">Subtotal</span><strong id="sub">Rp 0</strong></div>
          <div><span data-i18n="cart.shipping">Shipping</span><span data-i18n="cart.shipping_note">Confirmed on WhatsApp</span></div>
          <p class="hint" data-i18n="cart.hint">Phase 0 checkout: your order is written to WhatsApp and answered personally. Midtrans can be added later.</p>
          <form class="form" id="form">
            <input name="name" data-i18n-placeholder="cart.name" placeholder="Name" required>
            <input name="city" data-i18n-placeholder="cart.city" placeholder="City / area" required>
            <textarea name="note" rows="3" data-i18n-placeholder="cart.note" placeholder="Note — scent preference, gift wrap, questions"></textarea>
            <button class="btn btn-dark full" type="submit" data-i18n="cart.send">Send order on WhatsApp</button>
          </form>
        </div>
      </div>
    </section>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <script src="assets/js/app.js"></script>
  <script>
    function render() {
      const lines = cartDetailed();
      const list = document.getElementById("list");
      const box = document.getElementById("box");
      if (!lines.length) {
        box.hidden = true;
        list.innerHTML = `<div class="cart-empty">
          <p class="quote" data-i18n="cart.empty_quote">The cart is quiet.</p>
          <p class="lede" data-i18n="cart.empty_lede">Begin with one oil.</p>
          <a class="btn btn-dark" href="shop.html" data-i18n="cart.empty_btn">Shop</a>
        </div>`;
        applyTranslations();
        return;
      }
      box.hidden = false;
      list.innerHTML = lines.map(i => `
        <div class="cart-item">
          <img src="${i.img}" alt="">
          <div>
            <strong>${i.name}</strong>
            <div class="meta">${i.kind}</div>
            <div class="qty" style="margin:8px 0 0">
              <button data-q="${i.id}" data-v="${i.qty-1}">−</button>
              <span>${i.qty}</span>
              <button data-q="${i.id}" data-v="${i.qty+1}">+</button>
            </div>
          </div>
          <div class="price">${fmt(i.line)}</div>
        </div>`).join("");
      document.getElementById("sub").textContent = fmt(cartTotal());
      applyTranslations();
    }

    window.__onLangChange = function () {
      render();
    };

    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-q]");
      if (!b) return;
      setQty(b.dataset.q, Number(b.dataset.v));
      render();
    });

    document.addEventListener("DOMContentLoaded", () => {
      render();
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const extra = `Nama: ${fd.get("name")}\nKota: ${fd.get("city")}\nCatatan: ${fd.get("note") || "-"}`;
        waOrder(extra);
      });
    });
  </script>
</body>
</html>
